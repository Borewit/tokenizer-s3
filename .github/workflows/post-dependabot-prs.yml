name: Dependabot Pull Request
on: pull_request_target

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependabot-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Label development-only dependencies
        if: ${{ steps.dependabot-metadata.outputs.dependency-type == 'direct:development' }}
        uses: actions/github-script@v9
        with:
          script: |
            const issue_number = context.payload.pull_request.number;
            const {owner, repo} = context.repo;
            await github.rest.issues.addLabels({owner, repo, issue_number, labels: ['dev-dependencies']});
            try {
              await github.rest.issues.removeLabel({owner, repo, issue_number, name: 'dependencies'});
            } catch (error) {
              if (error.status !== 404) throw error;
            }
